<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>PulseStream — Fast, Ad-Free Music &amp; Video Engine</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Official YouTube IFrame Player Engine -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <div class="brand" id="brand-home" style="cursor: pointer;">
      <span class="brand-icon">▶</span>
      <span class="brand-name">PulseStream</span>
    </div>

    <form id="search-form" class="search-box">
      <input type="text" id="search-input" placeholder="Search songs, artists, Punjabi, Hindi..." required autocomplete="off" />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div class="header-tags">
      <span class="pill-badge">Ad-Free</span>
      <span class="pill-badge" style="border-color: #f59e0b; color: #f59e0b;">Clean Sound</span>
    </div>
  </header>

  <main class="app-container">

    <!-- Active High-Performance Player Desk -->
    <section id="player-desk" class="player-desk hidden">
      <div class="video-wrapper">
        <div id="yt-player-container"></div>
      </div>

      <div class="media-controls-deck">
        <div class="media-meta">
          <h2 id="current-title">Select a track</h2>
          <p id="current-uploader" class="text-muted">Channel</p>
        </div>

        <div class="action-buttons">
          <button type="button" id="btn-toggle-audio-mode" class="btn btn-outline">🎵 Audio Only Mode</button>
          <a id="btn-download-media" class="btn btn-gold" href="#" target="_blank">⬇ Download File</a>
        </div>
      </div>

      <!-- Live Synced Lyrics -->
      <div class="lyrics-card">
        <div class="lyrics-header">
          <h3>Live Lyrics</h3>
          <span id="lyrics-status" class="text-muted text-sm">Waiting for playback...</span>
        </div>
        <div id="lyrics-container" class="lyrics-content">
          <p class="placeholder-text">Play any song to auto-fetch lyrics.</p>
        </div>
      </div>
    </section>

    <!-- Content Feed Section -->
    <section class="content-feed">
      <div class="feed-header">
        <h3 id="feed-title">Recommended Hits &amp; Music</h3>
        <span id="feed-status" class="text-muted text-sm"></span>
      </div>

      <div id="video-grid" class="video-grid">
        <p class="empty-state">Loading tracks...</p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
